[package]
name = "dupli"
version = "0.1.0"
edition = "2021"
description = "A minimal, extensible Rust coding agent"
license = "MIT"

[[bin]]
name = "dupli"
path = "src/main.rs"

[workspace]
members = ["site", "web-client"]
resolver = "2"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
rustyline = "14"
similar = "2"
dirs = "5"
axum = { version = "0.7", features = ["json"] }
futures = "0.3"
tokio-stream = "0.1"
base64 = "0.22"
crossterm = "0.28"

[profile.release]
strip = true
lto = true
