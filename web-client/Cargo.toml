[package]
name = "dupli-web-client"
version = "0.1.0"
edition = "2021"
description = "Leptos (CSR) frontend for the Dupli web UI"

[lib]
crate-type = ["cdylib"]

[dependencies]
leptos = { version = "0.6", default-features = false, features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window",
  "Document",
  "Element",
  "Headers",
  "HtmlElement",
  "Request",
  "RequestInit",
  "Response",
  "ReadableStream",
  "ReadableStreamDefaultReader",
]
