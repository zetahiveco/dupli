name: App Deploy
on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Login to github
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ secrets.GIT_USER }}
          password: ${{ secrets.GIT_PAT }}

      - name: Build API Image
        uses: docker/build-push-action@v2
        with:
          context: ./
          push: true
          tags: ghcr.io/zetahiveco/dupli-app

      - name: SSH and Deploy App
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: root
          password: ${{ secrets.SERVER_PASS }}
          script: |
            docker stop $(docker ps -a -q) || true
            docker rm $(docker ps -a -q) || true
            docker rmi $(docker images -q) || true
            docker pull ghcr.io/zetahiveco/dupli-app:latest
            docker run -d --env-file /root/.env -p 3000:3000 ghcr.io/zetahiveco/dupli-app pnpm start
            docker run -d --env-file /root/.env -e TOTAL_WORKERS=1 -e WORKER_INDEX=0 ghcr.io/zetahiveco/dupli-app pnpm start:backend
